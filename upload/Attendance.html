            font-weight: bold;
        }

            background: #1e293b;
            padding: 25px;
            border-radius: 12px;

        function handleAutoReset(currentPeriodName) {
            const todayDate = new Date().toDateString();
            const savedDate = localStorage.getItem('lastAttendanceDate');
            const savedPeriod = localStorage.getItem('lastAttendancePeriod');


            if (savedDate !== todayDate) {
                resetData();
                localStorage.setItem('lastAttendanceDate', todayDate);
                if (currentPeriodName) {
                    localStorage.setItem('lastAttendancePeriod', currentPeriodName);
                }
                saveToLocalStorage();
                return;
            }

            if (currentPeriodName && savedPeriod !== currentPeriodName) {
                resetData();
                localStorage.setItem('lastAttendanceDate', todayDate);
                localStorage.setItem('lastAttendancePeriod', currentPeriodName);
                saveToLocalStorage();
            } else {
                loadFromLocalStorage();
            }
        }

        function resetData() {
            localStorage.removeItem('presentCounts');
            localStorage.removeItem('attendanceLog');
            localStorage.removeItem('scannedCards');
            currentPresentCounts = { "II/3rd SEM": 0, "III/5th SEM": 0, "IV/7th SEM": 0 };
            excelAttendanceLog = [];
            scannedCardsSet = new Set();
        }

        function saveToLocalStorage() {
            localStorage.setItem('presentCounts', JSON.stringify(currentPresentCounts));
            localStorage.setItem('attendanceLog', JSON.stringify(excelAttendanceLog));
            localStorage.setItem('scannedCards', JSON.stringify(Array.from(scannedCardsSet)));
        }

        function loadFromLocalStorage() {
            if (localStorage.getItem('presentCounts')) {
                currentPresentCounts = JSON.parse(localStorage.getItem('presentCounts'));
                excelAttendanceLog = JSON.parse(localStorage.getItem('attendanceLog')) || [];
                scannedCardsSet = new Set(JSON.parse(localStorage.getItem('scannedCards'))) || new Set();
            }
        }

                    <th>PERIOD</th>
                    <th>SUBJECT/CODE</th>

                    <td style="color: #f87171; font-weight: bold; font-size:18px;">${abs2 < 0 ? 0 : abs2}</td>
                </tr>
                <tr>
                    <td>III/5th SEM</td>
                    <td>${period}</td>
                    <td>${sub2}</td>
                    <td>${fac2}</td>
                    <td style="color: #4ade80; font-weight: bold; font-size:18px;">${currentPresentCounts["III/5th SEM"]}</td>
                    <td style="color: #f87171; font-weight: bold; font-size:18px;">${abs3 < 0 ? 0 : abs3}</td>
                </tr>
                <tr>
                    <td>IV/7th SEM</td>
                    <td>${period}</td>
                    <td>${sub3}</td>
                    <td>${fac3}</td>
                    <td style="color: #4ade80; font-weight: bold; font-size:18px;">${currentPresentCounts["IV/7th SEM"]}</td>
                    <td style="color: #f87171; font-weight: bold; font-size:18px;">${abs4 < 0 ? 0 : abs4}</td>
                </tr>
            </table>
        </div>`;

                document.getElementById("timetable").innerHTML = "<h1 class='holiday';'>Break Time / No Class</h1>";

        const scanMessage = document.getElementById('scan-message');
        const downloadExcelBtn = document.getElementById('downloadExcelBtn');

        barcodeSlotInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                const scannedCode = this.value.trim();
                this.value = '';
                if (scannedCode === '') return;

                if (isHoliday || !period) {
                    scanMessage.textContent = "Scan Rejected ❌: No active class timing right now!";
                    scanMessage.style.color = "#f87171";
                    return;
                }

                if (studentDatabase[scannedCode]) {
                    const student = studentDatabase[scannedCode];

                    if (scannedCardsSet.has(scannedCode)) {
                        scanMessage.textContent = `Rejected ⚠: ${student.name} (${student.reg}) already marked!`;
                        scanMessage.style.color = "#fbbf24";
                    } else {
                        scanMessage.textContent = `Logged ✓: ${student.name} [${student.year}]`;
                        scanMessage.style.color = "#4ade80";

                        const now = new Date();
                        const entryDate = now.toISOString().split('T')[0];
                        const entryTime = now.toTimeString().split(' ')[0];

                        excelAttendanceLog.push({
                            barcode: scannedCode,
                            reg: student.reg,
                            name: student.name,
                            year: student.year,
                            date: entryDate,
                            time: entryTime
                        });

                        scannedCardsSet.add(scannedCode);

                        if (currentPresentCounts[student.year] !== undefined) {
                            currentPresentCounts[student.year] += 1;

                            saveToLocalStorage();
                            renderTimetableTable();
                        }
                    }
                } else {

                    // invalid card user
                }
            } 

        });

                alert("No attendance data logged in this session yet!");
                return;
            }
            let csvHeader = "Barcode,Register No,Student Name,Year/Sem,Date,Time\n";
            excelAttendanceLog.forEach(row => {
                csvHeader += `"${row.barcode}","${row.reg}","${row.name}","${row.year}","${row.date}","${row.time}"\n`;
            });

            const blob = new Blob([csvHeader], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", "EEE_Smart_Attendance_Report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
