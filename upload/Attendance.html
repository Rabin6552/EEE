<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEE Smart Attendance Monitoring System</title>
    <link rel="icon" href="EEE LOGO.png">

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            font-size: 50px;
            margin-left: 160px;
            margin-right: 180px;
        }

        h2 {
            color: #cbd5e1;
            font-size: 30px;
        }

        p {
            color: #cbd5e1;
            font-size: 30px;
            font-weight: bold;
        }

        #clock {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #38bdf8;
            font-size: 30px;
            font-weight: bold;
        }

        #date {
            position: absolute;
            top: 60px;
            right: 20px;
            color: #cbd5e1;
            font-size: 18px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-spacing: 10px;
            margin: auto;
            margin-top: 50px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        .logo {
            border-radius: 20px;
            position: absolute;
            top: 20px;
            left: 20px;
            width: 120px;
            height: auto;
        }

        .holiday {
            color: #f87171;
            font-size: 50px;
            font-weight: bold;
        }

        .barcode-hardware-container {
            margin: 50px auto 0 auto;
            width: 85%;
            max-width: 550px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            margin-top: 2px;
        }

        .barcode-hardware-container h3 {
            margin-top: 0;
            color: #38bdf8;
        }

        .barcode-slot-input {
            width: 90%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            text-align: center;
            outline: none;
        }

        .barcode-slot-input:focus {
            border-color: #38bdf8;
        }

        #scan-message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        .action-buttons-row {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .excel-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .excel-btn:hover {
            background: #16a34a;
        }

        .college-name {
            color: #f87171;
        }
    </style>
