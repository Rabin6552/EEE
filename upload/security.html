<!DOCTYPE html>
<html>
<head>
    <title>EEE Smart Attendance Monitoring System</title>
    <link rel="icon" href="EEE LOGO.png">
  
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#2563eb);
        }

        #loginBox{
            background:white;
            width:380px;
            padding:40px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 8px 25px rgba(0,0,0,0.3);
        }

        .logo{
            width:150px;
            margin-bottom:15px;
        }

        h1{
            color:#2563eb;
            font-size:22px;
            margin-bottom:5px;
        }

        h2{
            color:#1e293b;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #cbd5e1;
            border-radius:8px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            
            
        }

        button:hover{
            background:#1d4ed8;
            transform:translateY(1px);
            
        }

        #message{
            margin-top:15px;
            color:red;
            font-weight:bold;
        }

        .footer{
            margin-top:20px;
            color:#64748b;
            font-size:13px;
        }
    </style>
</head>

<body>

<div id="loginBox">

    <img src="psn logo pic.png" class="logo" alt="PSN Logo">
    <h1>EEE Smart Attendance Monitoring System</h1>
    <input type="text" id="username" placeholder=" Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>

    <div class="footer">
        Department of Electrical and Electronics Engineering
    </div>

</div>
